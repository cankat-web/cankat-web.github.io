<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yönetim paneli · Katalog örneği</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="c.css">
</head>
<body class="panel">
<div class="demo-bar">Örnek panel · Değişiklikler sadece bu tarayıcıda saklanır · <a href="index.html">Siteye dön</a></div>
<div class="kt-sek" id="kt-sek"></div>
<header class="site-head">
  <div class="container">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="14 16 72 68" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="8"><path d="M20 22H80"/><path d="M50 22V78"/><path d="M20 78H80"/><path d="M30 34V44a20 16 0 0 0 40 0V34"/></g></svg>
      <span><b>Yönetim paneli</b><small id="b-ad"></small></span>
    </a>
    <a class="btn btn-ghost" href="index.html" style="padding:11px 16px">Siteyi gör</a>
  </div>
</header>
<main class="container">
  <div style="padding-top:28px">
    <h1 style="font-size:clamp(30px,5vw,44px)" id="p-baslik"></h1>
    <p class="note" style="margin-top:6px" id="p-not"></p>
  </div>
  <div class="ptools">
    <label for="zam">Tüm fiyatlara<input id="zam" type="number" inputmode="decimal" value="10" step="1"> %</label>
    <button class="btn btn-primary" id="zamla" type="button">Uygula</button>
    <span class="note">Fiyatlar 10 TL'ye yuvarlanır.</span>
  </div>
  <div class="panel-wrap">
    <div class="tbl">
      <table>
        <thead><tr><th></th><th id="th-ad"></th><th>Fiyat (₺)</th><th>Durum</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <form class="pform" id="f" novalidate>
      <h2 id="ftitle"></h2>
      <input type="hidden" id="pid">
      <label for="ad"><span id="l-ad"></span><input id="ad" required></label>
      <div class="row2">
        <label for="kategori">Bölüm<select id="kategori"></select></label>
        <label for="fiyat">Fiyat (₺)<input id="fiyat" type="number" inputmode="numeric" min="0"></label>
      </div>
      <div class="row2">
        <label for="o1"><span id="l-o1"></span><input id="o1"></label>
        <label for="o2"><span id="l-o2"></span><input id="o2"></label>
      </div>
      <label for="aciklama">Açıklama<textarea id="aciklama"></textarea></label>
      <fieldset id="etk"><legend>Etiketler</legend></fieldset>
      <label for="foto">Fotoğraf<select id="foto"></select><span class="note">Gerçek panelde telefondan fotoğraf yüklenir; örnekte hazır fotoğraflardan seçilir.</span></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" type="submit">Kaydet</button>
        <button class="btn btn-ghost" type="button" id="cancel">Temizle</button>
      </div>
      <button type="button" id="reset" class="note" style="background:none;border:0;text-align:left;padding:0;cursor:pointer;text-decoration:underline">Örnek listeye geri dön</button>
    </form>
  </div>
</main>
<script src="data.js"></script>
<script src="../assets/site.js"></script>
<script>
(function(){
  var K = KT, list = menuYukle();
  // Panel açık zeminli; sektörün koyu renkleri yerine panel renkleri kullanılır, vurgu rengi sektörden gelir.
  ['--bg','--ink','--muted','--line','--soft','--card','--ph-bg','--on-accent'].forEach(function(p){ document.documentElement.style.removeProperty(p); });
  if (K.tema !== 'koyu') { document.body.style.setProperty('--accent', K.renk.accent); document.body.style.setProperty('--accent-dark', K.renk.dark); }
  document.documentElement.setAttribute('data-tema', 'panel');
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var tekil = { yemek: 'Yemek', ilan: 'İlan', 'araç': 'Araç', 'ürün': 'Ürün' }[K.sayac] || 'Ürün';
  var F = ['ad','kategori','fiyat','o1','o2','aciklama','foto'];
  ktSecici($('kt-sek'));
  document.title = 'Yönetim paneli · ' + K.ad;
  $('b-ad').textContent = K.ad;
  $('p-baslik').textContent = { yemek: 'Menü', ilan: 'İlanlar', 'araç': 'Araçlar', 'ürün': 'Ürünler' }[K.sayac] || 'Ürünler';
  $('p-not').textContent = 'Fiyatı tablodan değiştirin, ' + ({ yemek: 'biten yemeği', ilan: 'satılan ilanı', 'araç': 'satılan aracı', 'ürün': 'biten ürünü' }[K.sayac] || 'biten ürünü') + ' tek dokunuşla "' + K.yok + '" yapın. Her değişiklik siteye hemen yansır.';
  $('th-ad').textContent = tekil; $('l-ad').textContent = tekil + ' adı';
  $('l-o1').textContent = K.o1; $('l-o2').textContent = K.o2;
  $('etk').insertAdjacentHTML('beforeend', Object.keys(K.etiketler).map(function(k){ return '<label><input type="checkbox" value="' + k + '"> ' + esc(K.etiketler[k]) + '</label>'; }).join(''));
  $('kategori').innerHTML = K.bolumler.map(function(k){ return '<option>' + esc(k) + '</option>'; }).join('');
  $('foto').innerHTML = '<option value="">Fotoğrafsız</option>' + K.fotolar.map(function(k){ return '<option value="' + k + '">' + k.replace(/^[a-z]+-/, '') + '</option>'; }).join('');
  [].forEach.call(document.querySelectorAll('a[href="index.html"]'), function(a){ a.href = 'index.html?s=' + KT_KEY; });
  var boxes = function(){ return [].slice.call(document.querySelectorAll('#etk input')); };
  function save(msg){ toast(menuKaydet(list) ? msg : 'Bu tarayıcı kaydetmeye izin vermiyor.'); }
  function draw(){
    var kats = K.bolumler.concat(list.map(function(p){ return p.kategori; }).filter(function(v,i,a){ return v && a.indexOf(v) === i && K.bolumler.indexOf(v) < 0; }));
    $('rows').innerHTML = kats.map(function(k){
      var rows = list.filter(function(p){ return p.kategori === k; }); if (!rows.length) return '';
      return '<tr><td class="cat-row" colspan="5">' + esc(k) + '</td></tr>' + rows.map(function(p){
        var yok = p.durum === 'yok';
        return '<tr><td>' + (p.foto ? '<img class="mini" src="' + foto(p.foto) + '" alt="">' : '<span class="mini" style="display:block"></span>') + '</td><td><b>' + esc(p.ad) + '</b></td>' +
          '<td><input class="pin" type="number" inputmode="numeric" value="' + esc(p.fiyat) + '" data-p="' + esc(p.id) + '" aria-label="' + esc(p.ad) + ' fiyatı"></td>' +
          '<td><button class="sw' + (yok ? ' off' : '') + '" data-s="' + esc(p.id) + '">' + esc(yok ? K.yok : K.varEtiket) + '</button></td>' +
          '<td style="white-space:nowrap"><button class="lnk" data-e="' + esc(p.id) + '">Düzenle</button><button class="lnk" data-d="' + esc(p.id) + '">Kaldır</button></td></tr>';
      }).join('');
    }).join('');
  }
  function find(id){ return list.filter(function(x){ return x.id === id; })[0]; }
  function clear(){ $('pid').value = ''; F.forEach(function(k){ $(k).value = ''; }); $('kategori').value = K.bolumler[0]; boxes().forEach(function(b){ b.checked = false; }); $('ftitle').textContent = 'Yeni ' + tekil.toLocaleLowerCase('tr'); }
  $('rows').addEventListener('change', function(e){
    var id = e.target.getAttribute('data-p'); if (!id) return;
    find(id).fiyat = Math.max(0, Math.round(+e.target.value || 0)); save('Fiyat güncellendi.');
  });
  $('rows').addEventListener('click', function(e){
    var t = e.target, s = t.getAttribute('data-s'), ed = t.getAttribute('data-e'), del = t.getAttribute('data-d');
    if (s) { var p = find(s); p.durum = p.durum === 'yok' ? 'var' : 'yok'; save(p.durum === 'yok' ? p.ad + ' sitede "' + K.yok + '" görünüyor.' : p.ad + ' yeniden ' + K.varEtiket.toLocaleLowerCase('tr') + '.'); draw(); }
    if (ed) { var q = find(ed); $('pid').value = q.id; F.forEach(function(k){ $(k).value = q[k] == null ? '' : q[k]; }); boxes().forEach(function(b){ b.checked = (q.etiket || []).indexOf(b.value) > -1; }); $('ftitle').textContent = tekil + ' düzenle'; $('ad').focus(); }
    if (del) {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Emin misiniz?'; return; }
      list = list.filter(function(x){ return x.id !== del; }); save(tekil + ' kaldırıldı.'); draw();
    }
  });
  $('zamla').addEventListener('click', function(){
    var r = parseFloat($('zam').value); if (!r) { toast('Bir oran yazın, ör. 10.'); return; }
    if ($('zamla').dataset.armed !== '1') { $('zamla').dataset.armed = '1'; $('zamla').textContent = 'Onayla (' + list.length + ' ' + K.sayac + ')'; return; }
    $('zamla').dataset.armed = ''; $('zamla').textContent = 'Uygula';
    list.forEach(function(p){ if (p.fiyat) p.fiyat = Math.max(10, Math.round(p.fiyat * (1 + r / 100) / 10) * 10); });
    save('Tüm fiyatlar %' + r + ' güncellendi.'); draw();
  });
  $('f').addEventListener('submit', function(e){
    e.preventDefault();
    if (!$('ad').value.trim()) { toast(tekil + ' adı gerekli.'); return; }
    var old = find($('pid').value) || {};
    var p = { id: $('pid').value || 'x' + Date.now(), durum: old.durum || 'var', not: old.not, birim: old.birim };
    F.forEach(function(k){ p[k] = $(k).value.trim(); }); p.fiyat = Math.round(+p.fiyat || 0);
    p.etiket = boxes().filter(function(b){ return b.checked; }).map(function(b){ return b.value; });
    var i = list.findIndex(function(x){ return x.id === p.id; });
    if (i > -1) list[i] = p; else list.push(p);
    save('Kaydedildi. Sitede görünüyor.'); draw(); clear();
  });
  $('cancel').addEventListener('click', clear);
  $('reset').addEventListener('click', function(){ try { localStorage.removeItem('katalog_' + KT_KEY); } catch (e) {} list = menuYukle(); draw(); clear(); toast('Örnek liste geri yüklendi.'); });
  draw(); clear();
})();
</script>
</body>
</html>
